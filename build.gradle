plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '1.0.0'
group = 'cn.blockforge.generated.maidartificearms'
base { archivesName = "Iron's Arms 'n Artifice and Maid" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.22'
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'irons_arms_n_artifice_and_maid', mod_name: "Iron's Arms 'n Artifice and Maid", mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.3.22']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar {
    archiveVersion = "forge1.20.1-${version}"
}
jar.finalizedBy('reobfJar')
