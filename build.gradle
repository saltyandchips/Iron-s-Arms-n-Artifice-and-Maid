plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'cn.blockforge.generated.maidartificearms'
base { archivesName = "Iron's Arms 'n Artifice and Maid" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.255'

    runs {
        client { client() }
        server { server() }
    }

    mods {
        irons_arms_n_artifice_and_maid { sourceSet sourceSets.main }
    }
}

def libJars = { String prefix -> fileTree(dir: 'libs', include: "${prefix}*.jar") }

dependencies {
    compileOnly libJars('touhoulittlemaid')
    compileOnly libJars('irons_artifice')
    compileOnly libJars('touhou_little_maid_personality')
    compileOnly libJars('geckolib')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    def props = [mod_id: 'irons_arms_n_artifice_and_maid', mod_name: "Iron's Arms 'n Artifice and Maid",
                 mod_version: project.version, minecraft_version: '1.21.1', neoforge_version: '21.1.255']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

jar {
    archiveVersion = "neoforge1.21.1-${version}"
    exclude '**/*.java'
}
